<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Траты — сколько у меня денег">
  <meta name="theme-color" content="#0D1015">
  <meta name="color-scheme" content="dark light">

  <!-- «Добавить на главный экран»: открывается как приложение, без адресной строки -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Траты">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Траты</title>
  <link rel="manifest" href="manifest.json">

  <!-- Пока грузится приложение — тёмный экран с пульсирующим кольцом,
       а не белая вспышка. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0D1015; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(60vmax 60vmax at 10% 5%, rgba(42,61,92,.55), transparent 60%),
        radial-gradient(60vmax 60vmax at 95% 95%, rgba(30,74,74,.5), transparent 60%),
        #0D1015;
      transition: opacity .35s ease;
    }
    #boot i {
      width: 56px; height: 56px; border-radius: 50%;
      border: 7px solid rgba(255,255,255,.9);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #EDF0F4; }
      #boot {
        background:
          radial-gradient(60vmax 60vmax at 10% 5%, rgba(195,211,236,.9), transparent 60%),
          radial-gradient(60vmax 60vmax at 95% 95%, rgba(207,230,224,.9), transparent 60%),
          #EDF0F4;
      }
      #boot i { border-color: rgba(17,24,39,.75); }
    }
    @keyframes pulse { 0%,100% { transform: scale(.85); opacity: .55 } 50% { transform: scale(1); opacity: 1 } }
  </style>
</head>
<body>
  <div id="boot"><i></i></div>
  <script>
    // Убираем заставку, когда Flutter нарисовал первый кадр.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 400);
    });
  </script>
  <script>
    // iPhone: когда выезжает клавиатура, Safari сдвигает всю страницу вверх,
    // чтобы показать поле. Но приложение и так поднимает шторку над
    // клавиатурой — выходил двойной сдвиг и серая полоса под шторкой.
    // Страница у нас никогда не прокручивается, поэтому возвращаем её на место.
    (function () {
      function pin() {
        if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
      }
      window.addEventListener('scroll', pin, { passive: true });
      var vv = window.visualViewport;
      if (vv) {
        vv.addEventListener('scroll', pin);
        vv.addEventListener('resize', function () {
          // клавиатура выезжает с анимацией — проверяем ещё полсекунды
          var n = 0;
          (function tick() { pin(); if (++n < 30) requestAnimationFrame(tick); })();
        });
      }
    })();
  </script>
  <script>
    // Обновления. Телефон почти не перезапускает приложение, а разворачивает
    // из памяти — и новая версия не подхватывалась. Поэтому при открытии и
    // при каждом возвращении в приложение сверяем отметку версии с сайтом;
    // если вышла новая — тихо скачиваем её, а перезапускаемся в следующий
    // раз, когда возвращаешься в приложение (а не посреди ввода).
    (function () {
      var BUILD = '37fcb0821c9f'; // подставляется при выкладке (tool/deploy.sh)
      if (BUILD.indexOf('%%') === 0 || !('serviceWorker' in navigator)) return;
      var ready = false, busy = false;
      function refresh() {
        return new Promise(function (done) {
          var sw = navigator.serviceWorker.controller;
          if (!sw) return done(false);
          var timer = setTimeout(function () { done(false); }, 60000);
          navigator.serviceWorker.addEventListener('message', function on(e) {
            if (e.data !== 'refreshed' && e.data !== 'refresh-failed') return;
            navigator.serviceWorker.removeEventListener('message', on);
            clearTimeout(timer);
            done(e.data === 'refreshed');
          });
          sw.postMessage('refresh');
        });
      }
      async function check() {
        if (busy || ready) return;
        busy = true;
        try {
          var r = await fetch('build.txt?t=' + Date.now(), { cache: 'no-store' });
          var now = r.ok ? (await r.text()).trim() : '';
          if (now && now !== BUILD) ready = await refresh();
        } catch (e) {
          // нет сети — проверим в следующий раз
        } finally {
          busy = false;
        }
      }
      function apply() {
        // не чаще раза в две минуты — на случай, если сайт ещё не везде обновился
        try {
          var last = Number(sessionStorage.getItem('tratyUpdate') || 0);
          if (Date.now() - last < 120000) return false;
          sessionStorage.setItem('tratyUpdate', String(Date.now()));
        } catch (e) {}
        location.reload();
        return true;
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') return;
        if (!(ready && apply())) check();
      });
      window.addEventListener('load', function () { setTimeout(check, 4000); });
    })();
  </script>
  <script>
    // Сайт в памяти телефона — открывается и без интернета (см. sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
