<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Траты — сколько у меня денег">
  <meta name="theme-color" content="#0D1015">
  <meta name="color-scheme" content="dark light">

  <!-- «Добавить на главный экран»: открывается как приложение, без адресной строки -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Траты">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Траты</title>
  <link rel="manifest" href="manifest.json">

  <!-- Пока грузится приложение — тёмный экран с пульсирующим кольцом,
       а не белая вспышка. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0D1015; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(60vmax 60vmax at 10% 5%, rgba(42,61,92,.55), transparent 60%),
        radial-gradient(60vmax 60vmax at 95% 95%, rgba(30,74,74,.5), transparent 60%),
        #0D1015;
      transition: opacity .35s ease;
    }
    #boot i {
      width: 56px; height: 56px; border-radius: 50%;
      border: 7px solid rgba(255,255,255,.9);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #EDF0F4; }
      #boot {
        background:
          radial-gradient(60vmax 60vmax at 10% 5%, rgba(195,211,236,.9), transparent 60%),
          radial-gradient(60vmax 60vmax at 95% 95%, rgba(207,230,224,.9), transparent 60%),
          #EDF0F4;
      }
      #boot i { border-color: rgba(17,24,39,.75); }
    }
    @keyframes pulse { 0%,100% { transform: scale(.85); opacity: .55 } 50% { transform: scale(1); opacity: 1 } }
  </style>
</head>
<body>
  <div id="boot"><i></i></div>
  <script>
    // Убираем заставку, когда Flutter нарисовал первый кадр.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(function () { b.remove(); }, 400);
    });
  </script>
  <script>
    // Сайт в памяти телефона — открывается и без интернета (см. sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
